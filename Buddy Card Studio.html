  :root{
    --bg:#EAE6DD; --panel:#FFFFFF; --panel-2:#F6F3EC;
    --ink:#16213E; --muted:#6A6E80; --line:rgba(22,33,62,.14);
    --accent:#F97360; --accent-ink:#B23F2D; --navy:#16213E;
    --focus:#00A6A6;
    --r:14px;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0D1426; --panel:#151E36; --panel-2:#1B2642;
    --ink:#EFEAE0; --muted:#9BA4BC; --line:rgba(239,234,224,.16);
    --accent:#FF8A78; --accent-ink:#FFB4A7; --navy:#FF8A78;
  }}
  :root[data-theme="dark"]{
    --bg:#0D1426; --panel:#151E36; --panel-2:#1B2642;
    --ink:#EFEAE0; --muted:#9BA4BC; --line:rgba(239,234,224,.16);
    --accent:#FF8A78; --accent-ink:#FFB4A7;
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"GS",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding-block:22px 40px;padding-left:16px;padding-right:16px}

  header.top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  header.top h1{font-size:23px;font-weight:700;margin:0;letter-spacing:-.01em}
  header.top p{margin:0;color:var(--muted);font-size:14px}

  .grid{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
  @media(min-width:920px){.grid{grid-template-columns:minmax(0,392px) minmax(0,1fr);align-items:start}}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
  .panel + .panel{margin-top:14px}

  .lbl{display:block;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}

  .types{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  .type{display:flex;align-items:center;gap:8px;text-align:left;background:var(--panel-2);border:1px solid transparent;color:var(--ink);
    border-radius:10px;padding:9px 10px;font:inherit;font-size:12.5px;font-weight:500;cursor:pointer;line-height:1.2}
  .type span.e{font-size:15px;line-height:1}
  .type:hover{border-color:var(--line)}
  .type[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
  :root[data-theme="dark"] .type[aria-pressed="true"]{color:#22160F}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .type[aria-pressed="true"]{color:#22160F}}

  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{flex:1 1 auto;min-width:88px;background:var(--panel-2);border:1px solid transparent;color:var(--ink);border-radius:10px;
    padding:9px 8px;font:inherit;font-size:12.5px;font-weight:500;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
  :root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#22160F}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#22160F}}

  .field{margin-top:14px}
  .field:first-child{margin-top:0}
  input[type=text],textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);
    font:inherit;font-size:14px;padding:10px 12px;resize:vertical}
  textarea{line-height:1.45}
  input[type=text]:focus,textarea:focus,.type:focus-visible,.seg button:focus-visible,button:focus-visible,label.file:focus-within{
    outline:2px solid var(--focus);outline-offset:2px}
  .hint{margin:6px 0 0;font-size:11.5px;color:var(--muted);line-height:1.4}
  .hint code{background:var(--panel-2);border-radius:4px;padding:1px 4px;font-size:11px}

  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  label.file{display:flex;align-items:center;justify-content:center;gap:9px;background:var(--panel-2);
    border:2px dashed var(--accent);border-radius:12px;padding:16px 14px;font-size:14px;font-weight:600;
    color:var(--accent-ink);cursor:pointer;text-align:center}
  label.file:hover{background:var(--panel)}
  label.file input{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
  label.file.drag{background:var(--panel);border-style:solid}
  .pastebox{margin-top:8px;min-height:54px;background:var(--panel-2);border:1px dashed var(--line);border-radius:12px;
    padding:12px;font-size:13px;color:var(--muted);outline:none;overflow:hidden}
  .pastebox:focus{border-color:var(--accent);color:var(--ink)}
  .pastebox img{max-width:100%}
  label.file .plus{font-size:19px;line-height:1;font-weight:400}
  .shot-loaded{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);
    border-radius:12px;padding:10px 12px;margin-top:8px}
  .shot-loaded img{width:34px;height:52px;object-fit:cover;object-position:top;border-radius:5px;flex:none;background:var(--panel)}
  .shot-loaded b{font-weight:500;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  .linkbtn{background:none;border:0;color:var(--accent-ink);font:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:2px 4px}
  label.check{display:flex;align-items:center;gap:9px;font-size:13.5px;cursor:pointer;padding:2px 0}
  label.check input{width:17px;height:17px;accent-color:var(--accent);cursor:pointer;margin:0}

  .stage{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;align-items:center}
  .canvas-shell{width:100%;display:flex;justify-content:center}
  canvas{max-width:100%;max-height:min(70vh,760px);height:auto;border-radius:6px;box-shadow:0 12px 34px rgba(12,18,34,.18);display:block}
  .stage footer{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%}
  .save{background:var(--navy);color:#fff;border:0;border-radius:11px;padding:12px 22px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .save:hover{opacity:.92}
  .save[disabled]{opacity:.45;cursor:not-allowed}
  :root[data-theme="dark"] .save{color:#22160F}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .save{color:#22160F}}
  .meta{font-size:12px;color:var(--muted)}
  .status{font-size:12.5px;color:var(--muted);min-height:16px;text-align:center}
  .status.err{color:#C2412C}
  :root[data-theme="dark"] .status.err{color:#FF9C8A}
</style>

<div class="wrap">
  <header class="top">
    <h1>Buddy Card Studio</h1>
    <p>Type the message, pick a template, download the card.</p>
  </header>

  <div class="grid">
    <div>
      <div class="panel">
        <span class="lbl">Template</span>
        <div class="types" id="types"></div>
      </div>

      <div class="panel">
        <div class="row2">
          <div>
            <span class="lbl">Size</span>
            <div class="seg" id="formats"></div>
          </div>
          <div>
            <span class="lbl">Theme</span>
            <div class="seg" id="themes"></div>
          </div>
        </div>
      </div>

      <div class="panel" id="fields"></div>
    </div>

    <div class="stage">
      <div class="canvas-shell"><canvas id="cv" width="1080" height="1350"></canvas></div>
      <footer>
        <button class="save" id="save">Download PNG</button>
        <span class="meta" id="meta"></span>
      </footer>
      <p class="status" id="status"></p>
    </div>
  </div>
</div>

  function hexA(hex,a){
    var h=hex.replace('#','');
    if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var n=parseInt(h,16);
    return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
  }
  function rr(c,x,y,w,h,r){
    r=Math.min(r,w/2,h/2);
    c.beginPath();
    c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
    c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
  }
  function f(weight,size){ return weight+' '+size+'px "'+FF+'", sans-serif'; }

  function parseRich(str){
    var out=[], re=/\*([^*]+)\*/g, last=0, m;
    while((m=re.exec(str))!==null){
      if(m.index>last) out.push({text:str.slice(last,m.index),hl:false});
      out.push({text:m[1],hl:true});
      last=m.index+m[0].length;
    }
    if(last<str.length) out.push({text:str.slice(last),hl:false});
    return out;
  }
  function toWords(str){
    var words=[];
    parseRich(str||'').forEach(function(seg){
      seg.text.split(/(\n)/).forEach(function(p){
        if(p==='\n'){ words.push({br:true}); return; }
        p.split(/\s+/).forEach(function(w){ if(w) words.push({text:w,hl:seg.hl}); });
      });
    });
    return words;
  }
  function wrapWords(words,maxW){
    var sp=ctx.measureText(' ').width, lines=[], cur=[], curW=0;
    for(var i=0;i<words.length;i++){
      var w=words[i];
      if(w.br){ lines.push(cur); cur=[]; curW=0; continue; }
      var ww=ctx.measureText(w.text).width;
      if(cur.length && curW+sp+ww>maxW){ lines.push(cur); cur=[w]; curW=ww; }
      else { curW += (cur.length?sp:0)+ww; cur.push(w); }
    }
    if(cur.length) lines.push(cur);
    return lines;
  }
  /* auto-shrink until the block fits; avoids a one-word last line where it can */
  function fitBlock(str,maxW,maxH,opt){
    var words=toWords(str), weight=opt.weight||700, lh=opt.lh||1.12,
        max=opt.max||96, min=opt.min||28, best=null;
    for(var s=max;s>=min;s-=2){
      ctx.font=f(weight,s);
      var factors=[1,0.95,0.9], chosen=null;
      for(var k=0;k<factors.length;k++){
        var lines=wrapWords(words,maxW*factors[k]);
        var h=lines.length*s*lh;
        if(h>maxH) continue;
        if(opt.maxLines && lines.length>opt.maxLines) continue;
        if(!chosen) chosen={lines:lines,h:h,size:s,weight:weight,lh:lh};
        var widow = lines.length>1 && lines[lines.length-1].length===1;
        if(!widow){ chosen={lines:lines,h:h,size:s,weight:weight,lh:lh}; break; }
      }
      if(chosen){ best=chosen; break; }
    }
    if(!best){
      ctx.font=f(weight,min);
      var l2=wrapWords(words,maxW);
      if(opt.maxLines) l2=l2.slice(0,opt.maxLines);
      best={lines:l2,h:l2.length*min*lh,size:min,weight:weight,lh:lh};
    }
    return best;
  }
  function drawBlock(b,x,y,color,hlColor,align){
    ctx.font=f(b.weight,b.size);
    ctx.textBaseline='alphabetic';
    for(var i=0;i<b.lines.length;i++){
      var line=b.lines[i], sp=ctx.measureText(' ').width, wsum=0;
      for(var j=0;j<line.length;j++){ wsum+=ctx.measureText(line[j].text).width; }
      wsum += sp*Math.max(0,line.length-1);
      var cx = align==='center' ? x-wsum/2 : x;
      var by = y + i*b.size*b.lh + b.size*0.79;
      for(var j2=0;j2<line.length;j2++){
        ctx.fillStyle = line[j2].hl ? hlColor : color;
        ctx.fillText(line[j2].text, cx, by);
        cx += ctx.measureText(line[j2].text).width + sp;
      }
    }
    return y + b.h;
  }

  var grainTile=null;
  function grain(){
    if(grainTile) return grainTile;
    var c=document.createElement('canvas'); c.width=c.height=140;
    var g2=c.getContext('2d'), im=g2.createImageData(140,140), dta=im.data;

      var v=200+Math.random()*55;
      dta[i]=dta[i+1]=dta[i+2]=v; dta[i+3]=255;
    }
    g2.putImageData(im,0,0);
    grainTile=ctx.createPattern(c,'repeat');
    return grainTile;
  }

  function chip(g,x,y,text){

    rr(ctx,x,y,w,h,h/2); ctx.fill();
    ctx.fillStyle = state.theme==='navy' ? g.accent : g.accent;
    ctx.textBaseline='middle'; ctx.textAlign='left';
    ctx.fillText(text,x+padX,y+h/2+1);
    if('letterSpacing' in ctx) ctx.letterSpacing='0px';
    ctx.textBaseline='alphabetic';
    return h;
  }

  function qrMatrix(link){
    try{
      var q=qrcode(0,'M'); q.addData(link); q.make(); return q;
    }catch(e){ return null; }
  }
  function drawQR(g,link,x,y,size){
    var q=qrMatrix(link); if(!q) return;
    ctx.fillStyle='#FFFFFF'; rr(ctx,x,y,size,size,18); ctx.fill();
    var pad=16, n=q.getModuleCount(), cell=(size-pad*2)/n;
    ctx.fillStyle='#16213E';
    for(var r=0;r<n;r++) for(var c=0;c<n;c++){
      if(q.isDark(r,c)) ctx.fillRect(x+pad+c*cell, y+pad+r*cell, Math.ceil(cell), Math.ceil(cell));
    }
  }

  function footerHeight(g){
    return g.d.link ? 196 : 92;
  }
  function drawFooter(g){
    var T=g.T, M=g.M, base=g.H-M;
    if(g.d.link){
      var qs=164, qx=g.W-M-qs, qy=base-qs;
      drawQR(g,g.d.link,qx,qy,qs);
      if(g.d.cta){
        ctx.font=f(500,25); ctx.fillStyle=T.muted; ctx.textAlign='right';
        ctx.fillText(g.d.cta, g.W-M, qy-18);
        ctx.textAlign='left';
      }
    }
    var ly=base-64;
    if(logoReady){
      var lw=64*(logo.width/logo.height);
      ctx.drawImage(logo, M, ly, lw, 64);
      ctx.font=f(700,32); ctx.fillStyle=T.ink; ctx.textBaseline='alphabetic';
      ctx.fillText('ProcrastBuddy', M+lw+16, ly+30);
      ctx.font=f(400,24); ctx.fillStyle=T.muted;
      ctx.fillText('procrastbuddy.com', M+lw+16, ly+60);
    }
  }

  function drawMascot(g,x,y,size){
    if(!logoReady) return;
    var w=size*(logo.width/logo.height);
    ctx.drawImage(logo, x-w/2, y-size/2, w, size);
  }

  function drawPhone(g,x,y,w,h){
    var T=g.T, r=w*0.11;
    ctx.save();
    ctx.shadowColor='rgba(8,12,24,0.30)'; ctx.shadowBlur=52; ctx.shadowOffsetY=18;
    ctx.fillStyle=T.phone; rr(ctx,x,y,w,h,r); ctx.fill();
    ctx.restore();
    var pad=w*0.035, sx=x+pad, sy=y+pad*1.5, sw=w-pad*2, sh=h-pad*2.4;
    ctx.save(); rr(ctx,sx,sy,sw,sh,r*0.8); ctx.clip();
    if(state.img){
      var im=state.img, sx0=0, sy0=0, sw0=im.width, sh0=im.height;
      /* Phone screenshots arrive with the OS status bar (clock, battery,
         signal) across the top. Trimming it is what makes the result read
         as a product shot rather than someone's raw screen grab. */
      if(state.trim){ var cut=Math.round(im.height*0.048); sy0=cut; sh0=im.height-cut; }
      var ir=sw0/sh0, br=sw/sh, dw, dh;
      if(ir>br){ dh=sh; dw=dh*ir; } else { dw=sw; dh=dw/ir; }
      ctx.drawImage(im, sx0, sy0, sw0, sh0, sx+(sw-dw)/2, sy, dw, dh);
    } else {
      ctx.fillStyle=T.surface; ctx.fillRect(sx,sy,sw,sh);
      ctx.fillStyle=T.muted; ctx.font=f(500,26); ctx.textAlign='center';
      ctx.fillText('Add a screenshot', sx+sw/2, sy+sh/2);
      ctx.textAlign='left';
    }
    ctx.restore();
    ctx.fillStyle='rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.arc(x+w/2, y+pad*0.8, 5, 0, Math.PI*2); ctx.fill();
  }

  /* ---------- layouts ---------- */
  function spotlight(g){
    var M=g.M, T=g.T, d=g.d, colW=g.W-M*2, y=M;
    var twoCol = state.img && (g.H/g.W)<1.35;
    var phoneW = Math.min(380, (g.W-M*2)*0.38);
    if(twoCol) colW = (g.W-M*2) - phoneW - 56;
    y += chip(g,M,y,d.label) + 42;
    var bottom = g.H - M - footerHeight(g) - 44;
    var visual = twoCol ? 0 : (state.img ? Math.min(760, (bottom-y)*0.62) : 340);
    var headH = twoCol ? (bottom-y)*0.58
              : (state.img ? (bottom-y-visual-40)*0.86 : (bottom-y-visual)*0.64);
    var head = fitBlock(d.headline, colW, headH, {weight:700,max:g.H>1600?132:112,min:46,lh:1.08});
    y = drawBlock(head, M, y, T.ink, g.accent) + 34;
    if(d.body){
      var body = fitBlock(d.body, colW*0.94, Math.max(130, bottom-y-(twoCol?0:visual+20)), {weight:400,max:46,min:28,lh:1.42,maxLines:4});
      y = drawBlock(body, M, y, T.muted, T.muted) + 24;
    }
    if(twoCol){
      var pw=phoneW, ph=pw/0.47, avail=bottom-M;
      if(ph>avail){ ph=avail; pw=ph*0.47; }
      drawPhone(g, g.W-M-pw, bottom-ph, pw, ph);
    } else if(state.img){
      var h2=bottom-y, pw2=Math.min(colW*0.62, h2*0.47), ph2=pw2/0.47;
      if(ph2>h2){ ph2=h2; pw2=ph2*0.47; }
      drawPhone(g, (g.W-pw2)/2, bottom-ph2, pw2, ph2);
    } else {
      drawMascot(g, g.W-M-170, bottom-160, 330);
    }
  }

  function tip(g){
    var M=g.M, T=g.T, d=g.d, colW=g.W-M*2, y=M;
    if(d.num){
      ctx.save();
      ctx.font=f(700,190); ctx.textAlign='right'; ctx.lineWidth=3;
      ctx.strokeStyle=hexA(g.accent,0.38);
      ctx.strokeText('#'+d.num, g.W-M, M+170);
      ctx.restore(); ctx.textAlign='left';
    }
    y += chip(g,M,y,d.label) + (d.num?120:44);
    var bottom = g.H - M - footerHeight(g) - 40;
    var head = fitBlock(d.headline, colW*(d.num?0.92:1), (bottom-y)*0.62, {weight:700,max:g.H>1600?122:102,min:44,lh:1.08});
    y = drawBlock(head, M, y, T.ink, g.accent) + 34;
    if(d.body){
      var body = fitBlock(d.body, colW, Math.max(130, bottom-y), {weight:400,max:44,min:28,lh:1.45,maxLines:7});
      y = drawBlock(body, M, y, T.muted, T.muted);
    }
  }

  function buddy(g){
    var M=g.M, T=g.T, d=g.d, y=M;
    y += chip(g,M,y,d.label) + 40;
    var bottom = g.H - M - footerHeight(g) - 30;
    var bubbleTop=y, bubbleBottom = bottom-46;
    var bw=g.W-M*2, bh=bubbleBottom-bubbleTop;
    ctx.save();
    ctx.shadowColor='rgba(10,16,30,0.10)'; ctx.shadowBlur=40; ctx.shadowOffsetY=12;
    ctx.fillStyle=T.surface; rr(ctx,M,bubbleTop,bw,bh,52); ctx.fill();
    ctx.restore();
    ctx.strokeStyle=T.line; ctx.lineWidth=2; rr(ctx,M,bubbleTop,bw,bh,52); ctx.stroke();
    ctx.fillStyle=T.surface;
    ctx.beginPath();
    ctx.moveTo(M+72, bubbleTop+bh-2);
    ctx.lineTo(M+62, bubbleTop+bh+44);
    ctx.lineTo(M+148, bubbleTop+bh-2);
    ctx.closePath(); ctx.fill();
    var pad=54, innerW=bw-pad*2, iy=bubbleTop+pad;
    var head=fitBlock(d.headline, innerW, bh-pad*2-(d.body?160:0), {weight:700,max:98,min:38,lh:1.12});
    iy = drawBlock(head, M+pad, iy, T.ink, g.accent) + 28;
    if(d.body){
      var body=fitBlock(d.body, innerW*0.95, Math.max(60, bubbleTop+bh-pad-iy), {weight:400,max:42,min:24,lh:1.45,maxLines:6});
      drawBlock(body, M+pad, iy, T.muted, T.muted);
    }
  }

  function quote(g){
    var M=g.M, T=g.T, d=g.d, colW=g.W-M*2, y=M;
    y += chip(g,M,y,d.label) + 36;
    ctx.font=f(700,210); ctx.fillStyle=hexA(g.accent,0.9);
    ctx.fillText('“', M-8, y+150);
    y += 124;
    var bottom = g.H - M - footerHeight(g) - 40;
    var head=fitBlock(d.headline, colW*0.96, (bottom-y)-200, {weight:500,max:g.H>1600?96:80,min:34,lh:1.26});
    y = drawBlock(head, M, y, T.ink, g.accent) + 50;
    if(d.name){
      ctx.font=f(700,40); ctx.fillStyle=T.ink; ctx.fillText('— '+d.name, M, y+34);
      if(d.role){ ctx.font=f(400,30); ctx.fillStyle=T.muted; ctx.fillText(d.role, M, y+82); }
    }
    drawMascot(g, g.W-M-115, bottom-115, 225);
  }

  function checklist(g){
    var M=g.M, T=g.T, d=g.d, colW=g.W-M*2, y=M;
    y += chip(g,M,y,d.label) + 40;
    var bottom = g.H - M - footerHeight(g) - 36;
    var items = (d.items||'').split('\n').map(function(s){return s.trim();}).filter(Boolean).slice(0,5);
    var reserve = items.length ? items.length*96+30 : 0;
    var head=fitBlock(d.headline, colW, Math.max(190,(bottom-y-reserve)*0.66), {weight:700,max:g.H>1600?108:90,min:40,lh:1.08});
    y = drawBlock(head, M, y, T.ink, g.accent) + 28;
    if(d.body){
      var body=fitBlock(d.body, colW*0.92, Math.max(60, bottom-y-reserve-20), {weight:400,max:40,min:24,lh:1.4,maxLines:3});
      y = drawBlock(body, M, y, T.muted, T.muted) + 30;
    }
    var space = bottom - y;
    var rowH = items.length ? Math.min(104, space/items.length) : 0;
    var fs = Math.max(26, Math.min(40, rowH*0.4));
    for(var i=0;i<items.length;i++){
      var ry = y + i*rowH;
      var cxr=M+22, cyr=ry+rowH*0.42, rad=21;
      ctx.beginPath(); ctx.arc(cxr,cyr,rad,0,Math.PI*2);
      ctx.strokeStyle=hexA(g.accent,0.85); ctx.lineWidth=3; ctx.stroke();
      ctx.font=f(500,fs); ctx.fillStyle=T.ink; ctx.textBaseline='middle';
      var txt=items[i], maxTW=colW-90;
      while(ctx.measureText(txt).width>maxTW && txt.length>4){ txt=txt.slice(0,-2); }
      if(txt!==items[i]) txt=txt+'…';
      ctx.fillText(txt, M+70, cyr+1);
      ctx.textBaseline='alphabetic';
    }
  }

  function milestone(g){
    var M=g.M, T=g.T, d=g.d, colW=g.W-M*2, cx=g.W/2, y=M;
    var seedStr=(d.num||'')+g.W;
    var seed=0; for(var i=0;i<seedStr.length;i++) seed=(seed*31+seedStr.charCodeAt(i))%99991;
    function rnd(){ seed=(seed*1103515245+12345)%2147483648; return seed/2147483648; }
    var cols=[g.accent,g.deco,LAGOON];
    for(var c=0;c<30;c++){
      var px=rnd()*g.W, py=M+rnd()*(g.H-M*2), s=14+rnd()*22;
      ctx.save(); ctx.translate(px,py); ctx.rotate(rnd()*Math.PI);
      ctx.fillStyle=hexA(cols[c%3], 0.5); ctx.fillRect(-s/2,-s/5,s,s/2.5); ctx.restore();
    }
    ctx.font=f(600,25);
    var chipW=(function(){ if('letterSpacing' in ctx) ctx.letterSpacing='0.13em'; var w=ctx.measureText(d.label||'').width+52; if('letterSpacing' in ctx) ctx.letterSpacing='0px'; return w; })();
    y += chip(g, cx-chipW/2, y, d.label) + 46;
    var bottom = g.H - M - footerHeight(g) - 40;
    if(d.headline){
      var head=fitBlock(d.headline, colW*0.8, 180, {weight:500,max:54,min:28,lh:1.25,maxLines:2});
      y = drawBlock(head, cx, y, T.muted, g.accent, 'center') + 22;
    }
    var numSize=Math.min(360, (bottom-y)*0.5);
    for(var s2=numSize; s2>=90; s2-=6){
      ctx.font=f(700,s2);
      if(ctx.measureText(d.num||'').width<=colW*0.94){ numSize=s2; break; }
    }
    ctx.font=f(700,numSize); ctx.fillStyle=g.accent; ctx.textAlign='center';
    ctx.fillText(d.num||'', cx, y+numSize*0.8);
    ctx.textAlign='left';
    y += numSize*1.02;
    if(d.sub){
      var sub=fitBlock(d.sub, colW*0.82, 150, {weight:600,max:48,min:26,lh:1.25,maxLines:2});
      y = drawBlock(sub, cx, y+14, T.ink, T.ink, 'center') + 24;
    }
    if(d.body){
      var body=fitBlock(d.body, colW*0.78, Math.max(50,bottom-y), {weight:400,max:38,min:22,lh:1.4,maxLines:3});
      drawBlock(body, cx, y+8, T.muted, T.muted, 'center');
    }
  }

  /* Brand lockup at the top — used by layouts whose art bleeds off the
     bottom edge, where a footer would be covered. */
  function drawTopBrand(g){
    if(!logoReady) return;
    var T=g.T, M=g.M, s=46, lw=s*(logo.width/logo.height);
    var wordW=(function(){ ctx.font=f(700,27); return ctx.measureText('ProcrastBuddy').width; })();
    var x=g.W-M-(lw+12+wordW);
    ctx.drawImage(logo, x, M+2, lw, s);
    ctx.font=f(700,27); ctx.fillStyle=T.ink; ctx.textBaseline='middle';
    ctx.fillText('ProcrastBuddy', x+lw+12, M+2+s/2);
    ctx.textBaseline='alphabetic';
  }

  function showcase(g){
    var M=g.M, T=g.T, d=g.d, colW=g.W-M*2, y=M;
    drawTopBrand(g);
    y += chip(g,M,y,d.label) + 40;
    var head=fitBlock(d.headline, colW*0.92, 320, {weight:700,max:g.H>1600?106:92,min:44,lh:1.08,maxLines:3});
    y = drawBlock(head, M, y, T.ink, g.accent) + 26;
    if(d.body){
      var body=fitBlock(d.body, colW*0.86, 130, {weight:400,max:38,min:26,lh:1.4,maxLines:2});
      y = drawBlock(body, M, y, T.muted, T.muted);
    }
    /* The phone runs off the bottom edge — cropping it to the card is what
       stops it looking like a sticker dropped onto a background. */
    var top=y+52;
    var ph=(g.H-top)+130, pw=ph*0.47;
    var maxW=Math.min(620, colW);
    if(pw>maxW){ pw=maxW; ph=pw/0.47; }
    drawPhone(g,(g.W-pw)/2, top, pw, ph);
    if(d.link){
      var qs=150, qx=M, qy=g.H-M-qs;
      drawQR(g,d.link,qx,qy,qs);
      if(d.cta){
        ctx.font=f(500,24); ctx.fillStyle=T.muted;
        ctx.fillText(d.cta, qx, qy-16);
      }
    }
  }

  var LAYOUTS = { spotlight:spotlight, tip:tip, buddy:buddy, quote:quote, checklist:checklist, milestone:milestone, showcase:showcase };
  var NO_FOOTER = { showcase:1 };

  /* ---------- draw ---------- */
  var queued=false;
  function draw(){
    if(queued) return; queued=true;
    requestAnimationFrame(function(){
      queued=false;
      var t=curType(), fm=curFormat(), T=THEMES[state.theme];
      cv.width=fm.w; cv.height=fm.h;
      var g={ W:fm.w, H:fm.h, M:88, T:T, accent:t.accent, deco:t.deco, d:curData() };
      ctx.textAlign='left'; ctx.textBaseline='alphabetic';
      background(g);
      (LAYOUTS[t.layout]||spotlight)(g);
      if(!NO_FOOTER[t.layout]) drawFooter(g);
      document.getElementById('meta').textContent = fm.w+' × '+fm.h+' · '+THEMES[state.theme].name;
    });
  }

  /* ---------- controls ---------- */
  var typesEl=document.getElementById('types');
  TYPES.forEach(function(t){
    var b=document.createElement('button');
    b.className='type'; b.type='button'; b.id='type-'+t.id;
    b.setAttribute('aria-pressed', String(t.id===state.type));
    b.innerHTML='<span class="e">'+t.emoji+'</span><span>'+t.name+'</span>';
    b.addEventListener('click',function(){
      state.type=t.id;
      Array.prototype.forEach.call(typesEl.children,function(c){ c.setAttribute('aria-pressed', String(c.id==='type-'+t.id)); });
      buildFields(); persist(); draw();

  });

  function seg(el, list, key){
    list.forEach(function(o){
      var b=document.createElement('button'); b.type='button'; b.textContent=o.name;
      b.id=key+'-'+o.id;
      b.setAttribute('aria-pressed', String(state[key]===o.id));
      b.addEventListener('click',function(){
        state[key]=o.id;

        persist(); draw();

  }
  seg(document.getElementById('formats'), FORMATS, 'format');
  seg(document.getElementById('themes'), [{id:'cream',name:'Cream'},{id:'navy',name:'Navy'}], 'theme');

  var FIELD_SETS = {
    spotlight:[['label','Label'],['headline','Headline'],['body','Body'],['image'],['trim'],['link','Link for QR code (optional)'],['cta','QR caption']],
    showcase:[['image'],['trim'],['label','Label'],['headline','Headline'],['body','Caption'],['link','Link for QR code (optional)'],['cta','QR caption']],
    tip:[['label','Label'],['num','Tip number (optional)'],['headline','The tip'],['body','Body'],['link','Link for QR code (optional)'],['cta','QR caption']],
    buddy:[['label','Label'],['headline','What Buddy says'],['body','Body'],['link','Link for QR code (optional)'],['cta','QR caption']],
    quote:[['label','Label'],['headline','The quote'],['name','Who said it'],['role','Their course / year'],['link','Link for QR code (optional)'],['cta','QR caption']],
    checklist:[['label','Label'],['headline','Headline'],['body','Intro line'],['items','Checklist (one per line)'],['link','Link for QR code (optional)'],['cta','QR caption']],
    milestone:[['label','Label'],['headline','Line above the number'],['num','The number'],['sub','What the number counts'],['body','Body'],['link','Link for QR code (optional)'],['cta','QR caption']]
  };
  var MULTILINE={body:1,items:1,headline:1};

  function loadShot(file){
    if(!file || !/^image\//.test(file.type||'')) return;
    var rd=new FileReader();
    rd.onload=function(ev){
      var im=new Image();
      im.onload=function(){ state.img=im; state.imgName=file.name||'Pasted screenshot'; buildFields(); draw(); };
      im.src=ev.target.result;
    };
    rd.readAsDataURL(file);
  }

  function adoptShotSrc(src){
    var im=new Image();
    im.onload=function(){ state.img=im; state.imgName='Pasted screenshot'; buildFields(); draw(); };
    im.onerror=function(){};
    im.crossOrigin='anonymous';
    im.src=src;
  }

  document.addEventListener('paste',function(e){
    if(curType().layout!=='showcase') return;
    var items=(e.clipboardData&&e.clipboardData.items)||[];
    for(var i=0;i<items.length;i++){
      if(items[i].kind==='file'&&/^image\//.test(items[i].type)){
        e.preventDefault(); loadShot(items[i].getAsFile()); return;
      }
    }
  });

  function buildFields(){
    var host=document.getElementById('fields'); host.innerHTML='';
    var t=curType(), d=curData();
    FIELD_SETS[t.layout].forEach(function(spec){
      var key=spec[0];
      var wrapEl=document.createElement('div'); wrapEl.className='field';
      if(key==='image'){
        var lab=document.createElement('label'); lab.className='file';
        lab.innerHTML='<span class="plus">+</span><span>'+(state.img?'Replace screenshot':'Add a screenshot')+'</span>';
        var inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.id='img-input';
        inp.addEventListener('change',function(e){
          var file=e.target.files&&e.target.files[0];
          loadShot(file); inp.value='';
        });
        lab.appendChild(inp);
        lab.addEventListener('click',function(e){
          if(e.target===inp) return;
          e.preventDefault(); e.stopPropagation();
          try{ inp.click(); }catch(err){}
        });
        ['dragenter','dragover'].forEach(function(ev){
          lab.addEventListener(ev,function(e){ e.preventDefault(); lab.classList.add('drag'); });
        });
        ['dragleave','drop'].forEach(function(ev){
          lab.addEventListener(ev,function(e){ e.preventDefault(); lab.classList.remove('drag'); });
        });
        lab.addEventListener('drop',function(e){
          var dt=e.dataTransfer; if(dt&&dt.files&&dt.files[0]) loadShot(dt.files[0]);
        });
        wrapEl.appendChild(lab);
        var fh=document.createElement('p'); fh.className='hint';
        fh.textContent='If the picker doesn’t open (common in the Claude mobile app), copy the screenshot and paste it into the box below — or drag the file onto the button on desktop.';
        wrapEl.appendChild(fh);
        var pb=document.createElement('div');
        pb.className='pastebox'; pb.contentEditable='true'; pb.setAttribute('role','textbox');
        pb.textContent='Tap here, then paste your screenshot';
        pb.addEventListener('focus',function(){ if(!pb.querySelector('img')) pb.textContent=''; });
        pb.addEventListener('blur',function(){ if(!pb.textContent.trim()&&!pb.querySelector('img')) pb.textContent='Tap here, then paste your screenshot'; });
        pb.addEventListener('paste',function(e){
          var items=(e.clipboardData&&e.clipboardData.items)||[];
          for(var i=0;i<items.length;i++){
            if(items[i].kind==='file'&&/^image\//.test(items[i].type)){
              e.preventDefault(); loadShot(items[i].getAsFile()); return;
            }
          }
        });
        pb.addEventListener('input',function(){
          var im=pb.querySelector('img');
          if(im&&im.src){ adoptShotSrc(im.src); pb.innerHTML=''; }
        });
        wrapEl.appendChild(pb);
        if(state.img){
          var box=document.createElement('div'); box.className='shot-loaded';
          var th=document.createElement('img'); th.src=state.img.src; th.alt='';
          var nm=document.createElement('b'); nm.textContent=state.imgName||'Screenshot';
          var clr=document.createElement('button'); clr.type='button'; clr.className='linkbtn'; clr.textContent='Remove';
          clr.addEventListener('click',function(){ state.img=null; state.imgName=''; buildFields(); draw(); });
          box.appendChild(th); box.appendChild(nm); box.appendChild(clr);
          wrapEl.appendChild(box);
        }
        host.appendChild(wrapEl); return;
      }
      if(key==='trim'){
        var row=document.createElement('label');
        row.className='check'; row.setAttribute('for','fld-trim');
        var cb=document.createElement('input'); cb.type='checkbox'; cb.id='fld-trim'; cb.checked=!!state.trim;
        cb.addEventListener('change',function(){ state.trim=cb.checked; draw(); });
        var sp=document.createElement('span'); sp.textContent='Trim the phone’s status bar';
        row.appendChild(cb); row.appendChild(sp);
        wrapEl.appendChild(row);
        var hint=document.createElement('p'); hint.className='hint';
        hint.textContent='Cuts the clock and battery row off the top of the screenshot.';
        wrapEl.appendChild(hint);
        host.appendChild(wrapEl); return;
      }
      var id='fld-'+key;
      var lb=document.createElement('label'); lb.className='lbl'; lb.setAttribute('for',id); lb.textContent=spec[1];
      var el;
      if(MULTILINE[key]){ el=document.createElement('textarea'); el.rows = key==='items'?4:2; }
      else { el=document.createElement('input'); el.type='text'; }
      el.id=id; el.value=d[key]||'';
      el.addEventListener('input',function(){ curData()[key]=el.value; persist(); draw(); });
      wrapEl.appendChild(lb); wrapEl.appendChild(el);
      if(key==='headline'){
        var h=document.createElement('p'); h.className='hint';
        h.innerHTML='Wrap words in <code>*asterisks*</code> to colour them.';
        wrapEl.appendChild(h);
      }
      host.appendChild(wrapEl);
    });
  }

  /* ---------- download ---------- */
  var saveBtn=document.getElementById('save'), statusEl=document.getElementById('status');
  var downloads=null;
  function say(msg,isErr){ statusEl.textContent=msg||''; statusEl.className='status'+(isErr?' err':''); }

  saveBtn.addEventListener('click',function(){
    if(!downloads){ say('Downloads aren’t available in this view.',true); return; }
    say('');
    cv.toBlob(function(blob){
      if(!blob){ say('Could not render the image.',true); return; }
      var fname='procrastbuddy-'+state.type+'-'+state.format+'.png';
      saveBtn.disabled=true;
      downloads.save({filename:fname,data:blob}).then(function(){
        say('Saved '+fname);
      })['catch'](function(err){
        var code=err&&err.code;
        if(code==='declined') say('Save cancelled.');
        else if(code==='rate_limited') say('One save at a time — try again in a moment.',true);
        else say('Couldn’t save that file.',true);
      }).then(function(){ saveBtn.disabled=false; });
    },'image/png');
  });

  if(window.claude&&window.claude.use){
    window.claude.use('downloads').then(function(d){
      downloads=d;
      if(!d){ saveBtn.disabled=true; say('Downloads aren’t available in this view.'); }
    })['catch'](function(){ saveBtn.disabled=true; });
  } else {
    saveBtn.disabled=true; say('Downloads aren’t available in this view.');
  }

  /* ---------- boot ---------- */
  buildFields();
  draw();
  if(document.fonts&&document.fonts.load){
    Promise.all([
      document.fonts.load('400 40px "GS"'),
      document.fonts.load('500 40px "GS"'),
      document.fonts.load('600 40px "GS"'),
      document.fonts.load('700 40px "GS"')
    ]).then(draw)['catch'](function(){});
  }
})();
</script>

</body></html>
